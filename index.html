<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expense Tracker</title>
<link rel="icon" type="image/png" id="fav" href="logol.png">
<script>/* favicon follows the browser/OS theme (that's what the tab bar uses): logol.png = light, logod.png = dark */
(function(){var q=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)');
function set(){var o=document.getElementById('fav'),l=document.createElement('link');
l.rel='icon';l.type='image/png';l.id='fav';l.href=q&&q.matches?'logod.png':'logol.png';
o?o.replaceWith(l):document.head.appendChild(l)}
set();if(q)q.addEventListener?q.addEventListener('change',set):q.addListener&&q.addListener(set)})()</script>
<script>(function(){
var d=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light',t=null,s=null;
try{t=localStorage.getItem('expense-tracker-theme');s=localStorage.getItem('expense-tracker-theme-sys')}catch(e){}
/* use the saved manual choice only if the device theme hasn't changed since it was made */
if((t!=='dark'&&t!=='light')||s!==d)t=d;
document.documentElement.dataset.theme=t})()</script>
<style>
:root{--k:#000;--w:#fff;--mut:#6b6b6b;--soft:#efefef;--red:#e03131;--blue:#1c7ed6;--green:#2f9e44;--debt:#e67700}
[data-theme=dark]{--k:#fff;--w:#000;--mut:#9a9a9a;--soft:#242424;--debt:#ffa94d;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--w);color:var(--k);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{position:relative;max-width:440px;height:100%;margin:auto;display:flex;flex-direction:column;border-inline:2px solid var(--k);overflow:hidden}
@media(max-width:440px){.app{border-inline:0}}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px 20px;border-bottom:2px solid var(--k)}
.logo{height:28px;width:auto;max-width:calc(100% - 56px);display:block}
.logo.d,[data-theme=dark] .logo.l{display:none}
[data-theme=dark] .logo.d{display:block}
.gear{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.gear svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid var(--k);border-radius:99px;padding:9px;font-weight:700}
.seg button.on{background:var(--k);color:var(--w)}
.st{color:var(--mut);text-align:center;min-height:1.4em}
main{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.chart{width:min(250px,68vw);aspect-ratio:1;flex:none}
.chart svg{width:100%;height:100%;display:block}
.seg{cursor:pointer}
.pill{min-width:min(260px,100%);max-width:100%;padding:6px 8px;border:2px solid var(--k);border-radius:16px;display:flex;align-items:center;gap:4px}
.pill .mid{flex:1;min-width:0;display:flex;gap:2px 8px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.mid small{width:100%;color:var(--mut);line-height:1.1}
.pn{width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;flex:none}
.pn:disabled{opacity:.2;cursor:default}
.pill i,.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.card{width:100%;border:2px solid var(--k);border-radius:24px;padding:14px 18px;cursor:pointer}
.nav{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.nav button{width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1}
.nav button:disabled{opacity:.2;cursor:default}
.tot{text-align:center;font-size:30px;font-weight:800;margin:2px 0 8px}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--soft);width:100%;text-align:left}
.row span:nth-child(2){flex:1}
.bar{display:flex;align-items:center;justify-content:space-evenly;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--k)}
.rb{width:46px;height:46px;border:2px solid var(--k);border-radius:50%;display:grid;place-items:center}
.rb.big{width:64px;height:64px;background:var(--k);color:var(--w)}
.rb svg{width:55%;height:55%;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.rb:active{transform:scale(.94)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
.ov.show{display:flex}
.ov.top{z-index:8}
.sh{width:100%;max-height:85%;overflow:auto;background:var(--w);border-top:2px solid var(--k);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.in{width:100%;border:2px solid var(--k);border-radius:14px;padding:12px 14px;background:var(--w);outline:0}
.in[type=date]{min-height:50px}
.in:focus{border-color:var(--blue)}
.two{display:flex;gap:10px}
.two #n{flex:1;min-width:0;width:auto}
.two #d{flex:none;width:158px;padding-inline:10px}
.amt{font-size:32px;font-weight:800}
.lb{color:var(--mut);font-size:16px;font-weight:700;margin-bottom:-8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--k);border-radius:99px;padding:6px 14px;display:flex;align-items:center;gap:8px}
.chip.on{background:var(--k);color:var(--w)}
.sw{display:flex;flex-wrap:wrap;gap:12px}
.cc{position:relative;width:34px;height:34px;border-radius:50%;border:2px dashed var(--k);display:grid;place-items:center;cursor:pointer;overflow:hidden}
.cc svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.cc input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--w);box-shadow:0 0 0 2px transparent}
.sw button.on{box-shadow:0 0 0 2px var(--k)}
.sw button.cc{border:2px dashed var(--k);box-shadow:none}
.sw button.cc.act{background:var(--k);color:var(--w);border-style:solid}
.sw.rmm button:not(.cc){position:relative}
.sw.rmm button:not(.cc)::after{content:'×';position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;font-weight:700;line-height:17px;text-align:center}
#cf{z-index:9;align-items:center;padding:24px}
.dlg{width:100%;background:var(--w);border:2px solid var(--k);border-radius:24px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:18px;text-align:center}
.dlg p{font-weight:700;font-size:19px;overflow-wrap:anywhere}
.seg button.dan{background:var(--red);border-color:var(--red);color:#fff}
.go{background:var(--k);color:var(--w);border-radius:14px;padding:13px;font-weight:700;width:100%}
.go:disabled{opacity:.35;cursor:default}
.go.ghost{background:none;color:var(--k);border:2px solid var(--k)}
.x{width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1;color:var(--red);flex:none}
#hist,#rep{position:absolute;inset:0;background:var(--w);display:none;flex-direction:column}
#hist{z-index:6}
#rep{z-index:7}
#hist.show,#rep.show{display:flex}
.hh{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;border-bottom:2px solid var(--k);font-size:24px;font-weight:800}
.hh .x{color:var(--k);font-size:28px}
.tabs{display:flex;gap:8px;padding:12px 20px 4px}
.tabs button{flex:1;border:2px solid var(--k);border-radius:99px;padding:6px;font-weight:700}
.tabs button.on{background:var(--k);color:var(--w)}
.hl{flex:1;overflow:auto;padding:8px 20px 20px}
.hl img{width:100%;display:block;border:2px solid var(--k);border-radius:14px;margin:8px 0 14px;background:var(--w)}
.rf{display:flex;flex-wrap:wrap;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--k)}
.rf:empty{display:none}
.rf .go{flex:1 1 40%;width:auto}
.dh{display:flex;justify-content:space-between;gap:10px;font-weight:800;padding:8px 14px;margin:16px 0 2px;background:var(--soft);border-radius:14px}
.dh+.it{border-top:0}
.it.g,.it.mo{width:100%;text-align:left}
.cv{width:32px;height:32px;display:grid;place-items:center;flex:none;color:var(--mut)}
.cv svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.g.open .cv svg{transform:rotate(90deg)}
.it.sub{padding:4px 0 4px 22px;border-top:0;color:var(--mut)}
.sub .neg{font-weight:600;color:var(--k)}
.it.mo{flex-wrap:wrap;row-gap:6px}
.mo .tr{flex:0 0 100%;height:4px;border-radius:99px;background:var(--soft);overflow:hidden}
.mo .tr i{display:block;height:100%;border-radius:99px;background:var(--k)}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--soft)}
.it .m{flex:1;min-width:0}
.it small{color:var(--mut);display:block}
.neg{font-weight:700}
.pos{color:var(--green)}
.seg button.on.inc{background:var(--green);border-color:var(--green);color:#fff}
.bal{display:flex;justify-content:space-around;flex-wrap:wrap;gap:2px 14px;margin:-2px 0 8px;color:var(--mut);font-size:16px;text-align:center}
.bal b{font-weight:800}
.x.ed{color:var(--mut);display:grid;place-items:center}
.ed svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.it.editing{background:var(--soft);border-radius:12px;padding-inline:8px}
/* view switch (Expense / Savings) */
.vsw{padding:10px 20px;border-bottom:2px solid var(--k)}
.app[data-view=e] .sv,.app[data-view=s] .ev{display:none}
/* savings */
.card.nc{cursor:default}
.cap{color:var(--mut);font-size:16px;text-align:center;margin:-8px 0 8px}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700;margin-bottom:6px}
.mid small.wdc{color:var(--red)}
.wdr{color:var(--red)}
.bar.sv{gap:0}
.pl{flex:1;border:2px solid var(--k);border-radius:99px;padding:12px 8px;font-weight:700;white-space:nowrap}
.pl.fill{background:var(--k);color:var(--w)}
.pl:active{transform:scale(.97)}
.av{color:var(--mut);font-size:16px;font-weight:700;margin-top:-4px}
.av.bad{color:var(--red)}
.go.wdb{background:var(--red);color:#fff}
.gsvg{width:100%;display:block;overflow:visible}
.gtg{color:var(--mut);font-weight:600;font-size:15px}
/* debt */
.dbc{color:var(--debt)}
.mid small.dbc{color:var(--debt)}
.seg button.on.dbt{background:var(--debt);border-color:var(--debt);color:#fff}
.go.dbtb{background:var(--debt);color:#fff}
[data-theme=dark] .seg button.on.dbt,[data-theme=dark] .go.dbtb{color:#000}
</style>

<body>
<div class="app" id="app" data-view="e">
   <header><span><img class="logo l" alt="Expense Tracker" src="AppLogoLight.png"><img class="logo d" alt="" aria-hidden="true" src="AppLogoDark.jpeg"></span><button class="gear" title="Settings" onclick="openSettings()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.6" stroke-width="3.2" stroke-dasharray="2.95 2.95"/><circle cx="12" cy="12" r="5.6"/><circle cx="12" cy="12" r="2.2"/></svg></button></header>

  <div class="seg vsw" role="group" aria-label="View">
    <button id="tE" class="on" aria-pressed="true" onclick="setView('e')">Expense</button>
    <button id="tS" aria-pressed="false" onclick="setView('s')">Savings</button>
  </div>

  <main class="ev">
    <div class="chart" id="chart"></div>
    <div class="pill" id="pill"></div>

  <main class="sv">

  <div class="bar ev">
    <button class="rb" title="Add category" onclick="openCat()"><svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1" fill="currentColor"/></svg></button>
    <button class="rb big" title="Add expense or income" onclick="openExp()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

  </div>
  <div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sh" id="sh"></div></div>
  <div id="hist"></div>
  <div id="rep"><div class="hh"><span>Report</span><button class="x" onclick="closeRep()" aria-label="Close">×</button></div><div class="hl" id="repb"></div><div class="rf" id="repf"></div></div>
  <div class="ov" id="cf" onclick="if(event.target===this)cfNo()"></div>
</div>

<script>
const K='expense-tracker-v1';
const COLORS=['#e03131','#1c7ed6','#2f9e44','#f08c00','#000000','#868e96'];
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.cats)||!Array.isArray(S.exp))S={cats:[
  {id:'c1',name:'Food',color:COLORS[0]},{id:'c2',name:'Travel',color:COLORS[1]},
  {id:'c3',name:'Bills',color:COLORS[2]},{id:'c4',name:'Other',color:COLORS[5]}],exp:[]};
if(!Array.isArray(S.colors))S.colors=[];
if(!Array.isArray(S.hidden))S.hidden=[];
/* savings: goals (sg) and entries (sv). An entry with wd:true is a withdrawal. Older saved data simply gets empty savings. */
if(!Array.isArray(S.sg))S.sg=[
  {id:'g1',name:'Emergency',color:COLORS[1]},{id:'g2',name:'Travel',color:COLORS[3]},
  {id:'g3',name:'Gadgets',color:COLORS[2]},{id:'g4',name:'Other',color:COLORS[5]}];
if(!Array.isArray(S.sv))S.sv=[];
/* debt: S.db entries {id,kind:'b'|'r',who,amt,note,ts}. b = borrowed (cash in, owed goes up), r = repaid (cash out, owed goes down). Neither counts as income or expense. */
if(!Array.isArray(S.db))S.db=[];
let addDebt=false,dKind='b',pickedLender=null,editDb=null; /* debt sheet: addDebt = Debt tab active, dKind = borrow / repay */
let V='e',addWd=false,editSv=null,pickedGoal=null; /* V = current page: 'e' expense, 's' savings; addWd = savings sheet is in Withdraw mode */
let rmMode=false,editId=null,addInc=false,editExp=null; /* editId = category being edited; addInc = add sheet is in Income mode */
const palette=()=>COLORS.filter(c=>!S.hidden.includes(c)).concat(S.colors);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const sumAmt=l=>l.reduce((a,e)=>a+e.amt,0);
/* balance carryover: running balance (income - expenses) from the month of the first income entry, up to time t.
   Nothing before the first income month counts, so older expense-only history doesn't show up as a negative balance. */
const incStart=()=>{let m=Infinity;S.exp.forEach(e=>{if(e.inc&&e.ts<m)m=e.ts});S.db.forEach(e=>{if(e.kind==='b'&&e.ts<m)m=e.ts});if(m===Infinity)return null;const d=new Date(m);return new Date(d.getFullYear(),d.getMonth(),1).getTime()};
const carryBefore=t=>{const s=incStart();if(s===null||t<=s)return 0;return Math.round((S.exp.reduce((a,e)=>e.ts>=s&&e.ts<t?a+(e.inc?e.amt:-e.amt):a,0)+S.db.reduce((a,e)=>e.ts>=s&&e.ts<t?a+(e.kind==='r'?-e.amt:e.amt):a,0))*100)/100};
const sgn=n=>(n>0?'+':'')+fmt(n);
const PEN='<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
const lum=c=>{const n=parseInt(c.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255};
const col=c=>{const d=document.documentElement.dataset.theme==='dark',l=lum(c);return d&&l<.18?'#ffffff':!d&&l>.88?'#000000':c};
const cat=id=>{const c=S.cats.find(c=>c.id===id)||{name:'Deleted',color:'#868e96'};return{...c,color:col(c.color)}};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const monthName=(y,m)=>new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
const T=new Date();let vy=T.getFullYear(),vm=T.getMonth(),sel=null,hTab='d',pc=COLORS[0],pickedCat=null;
let mode='d',dOff=0; /* mode: 'm' = pie shows the month, 'd' = pie shows one day; dOff = days back from today. Default on load: today */
const dayStart=o=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()-o)};
const sameDay=(ts,d)=>{const x=new Date(ts);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()&&x.getDate()===d.getDate()};
const maxBack=()=>{if(!S.exp.length&&!S.db.length)return 0;const m=S.db.reduce((a,e)=>Math.min(a,e.ts),S.exp.reduce((a,e)=>Math.min(a,e.ts),Infinity)),f=new Date(m);return Math.max(0,Math.round((dayStart(0)-new Date(f.getFullYear(),f.getMonth(),f.getDate()))/864e5))};
const dayLabel=o=>{if(o===0)return'Today';if(o===1)return'Yesterday';const d=dayStart(o),o2={weekday:'short',day:'numeric',month:'short'};if(d.getFullYear()!==new Date().getFullYear())o2.year='numeric';return d.toLocaleDateString('en-US',o2)};

function sums(list){const m={};list.forEach(e=>m[e.cat]=(m[e.cat]||0)+e.amt);
  return Object.entries(m).map(([id,v])=>({id,v})).sort((a,b)=>b.v-a.v)}
const inMonth=e=>{const d=new Date(e.ts);return d.getFullYear()===vy&&d.getMonth()===vm};
/* debt helpers: lenders are matched by name, ignoring case */
const r2=n=>Math.round(n*100)/100,lk=w=>String(w||'').trim().toLowerCase();
function lendersIn(list,t){ /* per lender: borrowed b, repaid r, owed; only entries before time t when t is given */
  const m={};
  list.forEach(e=>{
    if(t!==undefined&&e.ts>=t)return;
    const k=lk(e.who),o=m[k]||(m[k]={k,name:e.who,b:0,r:0,first:e.ts});
    if(e.ts<o.first){o.first=e.ts;o.name=e.who}
    if(e.kind==='r')o.r+=e.amt;else o.b+=e.amt;
  });
  return Object.values(m).map(o=>({...o,b:r2(o.b),r:r2(o.r),owed:r2(o.b-o.r)}));
}
const lenders=(t,skip)=>lendersIn(S.db.filter(e=>e.id!==skip),t);
const debtAt=t=>r2(lenders(t).reduce((a,o)=>a+Math.max(0,o.owed),0)); /* total still owed before time t */

function render(){
  const mx=maxBack();if(dOff>mx)dOff=mx;
  /* income entries (inc:true) are kept out of the pie and category totals; they only add to the income / balance lines */
  const D=dayStart(dOff),dAll=S.exp.filter(e=>sameDay(e.ts,D)),dl=dAll.filter(e=>!e.inc),dTot=sumAmt(dl),dInc=sumAmt(dAll.filter(e=>e.inc));
  const carry=carryBefore(new Date(vy,vm,1).getTime());
  const mAll=S.exp.filter(inMonth),me=mAll.filter(e=>!e.inc),mTot=sumAmt(me),mInc=sumAmt(mAll.filter(e=>e.inc)),mRows=sums(me);
  /* debt: borrowed / repaid that day and that month. Kept out of the pie and the expense totals, but they move the balance. */
  const dDb=S.db.filter(e=>sameDay(e.ts,D)),dBor=sumAmt(dDb.filter(e=>e.kind==='b')),dRep=sumAmt(dDb.filter(e=>e.kind==='r'));
  const mDb=S.db.filter(inMonth),mBor=sumAmt(mDb.filter(e=>e.kind==='b')),mRep=sumAmt(mDb.filter(e=>e.kind==='r'));
  const dDbt=r2(dBor-dRep),mDbt=r2(mBor-mRep),owedNow=debtAt(new Date(vy,vm+1,1).getTime()),mBal=r2(carry+mInc+mBor-mRep-mTot);
  const tot=mode==='d'?dTot:mTot,rows=mode==='d'?sums(dl):mRows;

function addDebtEntry(){

  }else{
    who=$('lw').value.trim();if(!who){$('lw').focus();return}

  }

  const rec={kind:dKind,who,amt:r2(amt),note:$('n').value.trim(),ts:new Date(D.getFullYear(),D.getMonth(),D.getDate(),t0.getHours(),t0.getMinutes(),t0.getSeconds(),t0.getMilliseconds()).getTime()};

function importData(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.cats)||!Array.isArray(d.exp))throw 0;
      const cids=new Set(S.cats.map(c=>c.id)),eids=new Set(S.exp.map(e=>e.id));
      let nc=0,ne=0;
      d.cats.forEach(c=>{
        if(c&&typeof c.id==='string'&&typeof c.name==='string'&&/^#[0-9a-f]{6}$/i.test(c.color)&&!cids.has(c.id)){
          S.cats.push({id:c.id,name:c.name.slice(0,20),color:c.color.toLowerCase()});cids.add(c.id);nc++;
        }
      });
      d.exp.forEach(e=>{
        if(e&&typeof e.id==='string'&&typeof e.cat==='string'&&Number.isFinite(e.amt)&&e.amt>0&&Number.isFinite(e.ts)&&!eids.has(e.id)){
          S.exp.push(Object.assign({id:e.id,cat:e.cat,amt:e.amt,note:typeof e.note==='string'?e.note.slice(0,60):'',ts:e.ts},e.inc===true?{inc:true}:{}));eids.add(e.id);ne++;
        }
      });
      /* savings goals + entries (files from before savings existed simply don't have them) */
      let ng=0,ns=0;
      if(Array.isArray(d.sg)){
        const gids=new Set(S.sg.map(c=>c.id));
        d.sg.forEach(c=>{
          if(c&&typeof c.id==='string'&&typeof c.name==='string'&&/^#[0-9a-f]{6}$/i.test(c.color)&&!gids.has(c.id)){
            S.sg.push(Object.assign({id:c.id,name:c.name.slice(0,20),color:c.color.toLowerCase()},Number.isFinite(c.target)&&c.target>0?{target:c.target}:{}));gids.add(c.id);ng++;
          }
        });
      }
      if(Array.isArray(d.sv)){
        const sids=new Set(S.sv.map(e=>e.id));
        d.sv.forEach(e=>{

/* extract report: pick a month / day / period, get a PNG report */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseIso=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const dfmt=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
let X={t:'m',y:vy,m:vm,d:'',from:'',to:''};
let repUrls=[],repFiles=[],pdfFile=null,pdfUrl='';

function startExtract(){
  const n=new Date();
  X.y=vy;X.m=vm;X.d=iso(dayStart(dOff));
  X.from=iso(new Date(n.getFullYear(),n.getMonth(),1));X.to=iso(n);
  openExtract();
}
function xStep(d){X.m+=d;if(X.m<0){X.m=11;X.y--}if(X.m>11){X.m=0;X.y++}openExtract()}
function preset(k){
  const n=new Date();
  if(k==='7')X.from=iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()-6));
  else if(k==='30')X.from=iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()-29));
  else X.from=iso(new Date(n.getFullYear(),0,1));
  X.to=iso(n);openExtract();
}
function xRange(){
  let a,b,label,file;
  if(X.t==='m'){
    a=new Date(X.y,X.m,1);b=new Date(X.y,X.m+1,1);label=monthName(X.y,X.m);file=X.y+'-'+pad(X.m+1);
  }else if(X.t==='d'){
    const d=parseIso(X.d);if(!d)return null;
    a=d;b=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    label=d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short',year:'numeric'});file=X.d;
  }else{
    let f=parseIso(X.from),t=parseIso(X.to);if(!f||!t)return null;
    if(f>t){const s=f;f=t;t=s}
    a=f;b=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1);
    label=dfmt(f)+' – '+dfmt(t);file=iso(f)+'_to_'+iso(t);
  }
  /* all = every entry in range; list = expenses only; incs = income only */
  const all=[...S.exp,...S.db].filter(e=>e.ts>=a.getTime()&&e.ts<b.getTime()).sort((p,q)=>p.ts-q.ts);
  const list=all.filter(e=>!e.inc&&!e.kind),incs=all.filter(e=>e.inc),dbs=all.filter(e=>e.kind);
  return{a,b,label,file,all,list,incs,dbs,total:sumAmt(list),incTotal:sumAmt(incs),bor:sumAmt(dbs.filter(e=>e.kind==='b')),rep:sumAmt(dbs.filter(e=>e.kind==='r')),carry:carryBefore(a.getTime())};
}
function openExtract(){
  const r=xRange(),n=r?r.all.length:0,today=iso(new Date());
  const tabs=[['m','Month'],['d','Day'],['p','Period']].map(([k,l])=>`<button class="${X.t===k?'on':''}" onclick="X.t='${k}';openExtract()">${l}</button>`).join('');
  let body;
  if(X.t==='m'){
    const now=new Date(),atNow=X.y===now.getFullYear()&&X.m===now.getMonth();
    body=`<div class="nav"><button onclick="xStep(-1)" aria-label="Previous month">‹</button><span>${monthName(X.y,X.m)}</span><button onclick="xStep(1)" aria-label="Next month" ${atNow?'disabled':''}>›</button></div>`;
  }else if(X.t==='d'){
    body=`<input class="in" type="date" value="${X.d}" max="${today}" onchange="X.d=this.value;openExtract()">`;
  }else{
    body=`<div class="chips"><button class="chip" onclick="preset('7')">Last 7 days</button><button class="chip" onclick="preset('30')">Last 30 days</button><button class="chip" onclick="preset('y')">This year</button></div>
    <div class="lb">From</div><input class="in" type="date" value="${X.from}" max="${today}" onchange="X.from=this.value;openExtract()">
    <div class="lb">To</div><input class="in" type="date" value="${X.to}" max="${today}" onchange="X.to=this.value;openExtract()">`;
  }
  const info=!r?'Pick a valid date':n?`${r.list.length} expense${r.list.length===1?'':'s'} · ${fmt(r.total)}`+(r.incs.length?` · +${fmt(r.incTotal)} income`:'')+(r.dbs.length?` · ${r.dbs.length} debt entr${r.dbs.length===1?'y':'ies'}`:''):'Nothing recorded in this range';
  showSheet(`<div class="seg">${tabs}</div>${body}<div class="st">${info}</div>
    <button class="go" onclick="makeReport()" ${n?'':'disabled'}>Create report</button>
    <div class="seg"><button onclick="openSettings()">Back</button></div>`);
}

/* minimal PDF writer: one JPEG per page, no libraries needed (works offline) */
async function buildPdf(cvs){
  const jb=await Promise.all(cvs.map(c=>new Promise(res=>c.toBlob(res,'image/jpeg',.95))));
  if(jb.some(b=>!b))throw 0;
  const jp=await Promise.all(jb.map(async b=>new Uint8Array(await b.arrayBuffer())));
  const enc=new TextEncoder(),parts=[],off=[],N=cvs.length,PW=595.28;let len=0;
  const put=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
  put(new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]));
  off[1]=len;put('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  off[2]=len;put('2 0 obj\n<< /Type /Pages /Count '+N+' /Kids ['+cvs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] >>\nendobj\n');
  cvs.forEach((c,i)=>{
    const pg=3+3*i,ct=pg+1,im=pg+2,ph=+(c.height*PW/c.width).toFixed(2),cs='q '+PW+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
    off[pg]=len;put(pg+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+ph+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>\nendobj\n');
    off[ct]=len;put(ct+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    off[im]=len;put(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+c.width+' /Height '+c.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jp[i].length+' >>\nstream\n');
    put(jp[i]);put('\nendstream\nendobj\n');
  });
  const M=3+3*N,xr=len;
  let x='xref\n0 '+M+'\n0000000000 65535 f \n';
  for(let i=1;i<M;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  put(x+'trailer\n<< /Size '+M+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}
async function makeReport(){
  const r=xRange();if(!r||!r.all.length)return;

      +(cs(repFiles)?bt("shareRep('img')",'Share image'+(blobs.length>1?'s':''),1):'')

    if(cnt>0&&hh+need>MAXH){pages.push(cur);cur=[mini];hh=mini.h;cnt=0}
    cur.push(it);hh+=it.h;cnt++;
  });

  return pages.map((pg,pi)=>{
    const ch=Math.max(a4?FH:0,P+pg.reduce((s,it)=>s+it.h,0)+FOOT);
    const c=document.createElement('canvas');c.width=W;c.height=ch;
    const g=c.getContext('2d');

    if(pages.length>1){g.textAlign='right';g.fillText('Page '+(pi+1)+' of '+pages.length,W-P,ch-30)}
    return c;
  });
}

/* history */

      const k=iso(new Date(e.ts));let d=days[days.length-1];
      if(!d||d.k!==k){d={k,ts:e.ts,tot:0,inc:0,bor:0,rep:0,rows:[],g:{}};days.push(d)}

        }else if(r.t==='g'&&r.items.length>1){
          const c=cat(r.cat),k=d.k+'|'+r.cat,open=hOpen.has(k);
          h+=`<button class="it g ${open?'open':''}" onclick="togG('${k}')" aria-expanded="${open}"><i class="dot" style="background:${c.color}"></i><span class="m"><span>${esc(c.name)}</span><small>${r.items.length} expenses</small></span><span class="neg">${fmt(r.tot)}</span><span class="cv"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span></button>`;
          if(open)r.items.forEach(e=>{h+=`<div class="it sub"><div class="m">${hTime(e.ts)}</div><span class="neg">${fmt(e.amt)}</span>${del(e)}</div>`});
        }else{

        }
      });
    });
  }else{
    const m={},n={},inc={},bo={},rp={};
    list.forEach(e=>{const d=new Date(e.ts),k=d.getFullYear()*12+d.getMonth();m[k]=m[k]||0;n[k]=n[k]||0;inc[k]=inc[k]||0;bo[k]=bo[k]||0;rp[k]=rp[k]||0;if(e.kind==='b')bo[k]+=e.amt;else if(e.kind==='r')rp[k]+=e.amt;else if(e.inc)inc[k]+=e.amt;else{m[k]+=e.amt;n[k]++}});
    const keys=Object.keys(m).sort((a,b)=>b-a),mx=Math.max(1,...keys.map(k=>m[k]));
    keys.forEach(k=>{

function delExp(id){

/* ───────────────────────── SAVINGS PAGE ───────────────────────── */
const svNet=l=>Math.round(l.reduce((a,e)=>a+(e.wd?-e.amt:e.amt),0)*100)/100; /* deposits − withdrawals */
const balBefore=(t,g)=>svNet(S.sv.filter(e=>e.ts<t&&(!g||e.cat===g)));        /* total (or one goal) saved before time t */
const gBal=id=>svNet(S.sv.filter(e=>e.cat===id));
const gl=id=>{const c=S.sg.find(c=>c.id===id)||{name:'Deleted',color:'#868e96'};return{...c,color:col(c.color)}};
const short=n=>{const a=Math.abs(n);return(n<0?'-':'')+'₹'+(a>=1e7?+(a/1e7).toFixed(1)+'Cr':a>=1e5?+(a/1e5).toFixed(1)+'L':a>=1e3?+(a/1e3).toFixed(1)+'k':Math.round(a))};
let sy=T.getFullYear(),sm=T.getMonth(),ssel=null,smode='d',sOff=0; /* same idea as the expense page: smode 'm' = month pie, 'd' = day pie */
const sMaxBack=()=>{if(!S.sv.length)return 0;const m=S.sv.reduce((a,e)=>Math.min(a,e.ts),Infinity),f=new Date(m);return Math.max(0,Math.round((dayStart(0)-new Date(f.getFullYear(),f.getMonth(),f.getDate()))/864e5))};
const inMonthS=e=>{const d=new Date(e.ts);return d.getFullYear()===sy&&d.getMonth()===sm};
const pnb=(fn,dis,lab,ch)=>`<button class="pn" onclick="${fn}" aria-label="${lab}" ${dis?'disabled':''}>${ch}</button>`;

function setView(v){
  V=v;
  try{localStorage.setItem('expense-tracker-view',v)}catch(e){}
  $('app').dataset.view=v;
  $('tE').classList.toggle('on',v==='e');$('tS').classList.toggle('on',v==='s');
  $('tE').setAttribute('aria-pressed',v==='e');$('tS').setAttribute('aria-pressed',v==='s');
  document.querySelectorAll('main').forEach(m=>{m.scrollTop=0});
}

function renderS(){
  const mx=sMaxBack();if(sOff>mx)sOff=mx;
  /* deposits feed the pie and totals; withdrawals are shown separately (like income on the expense page) */
  const D=dayStart(sOff),dAll=S.sv.filter(e=>sameDay(e.ts,D)),dl=dAll.filter(e=>!e.wd),dTot=sumAmt(dl),dW=sumAmt(dAll.filter(e=>e.wd));
  const mAll=S.sv.filter(inMonthS),me=mAll.filter(e=>!e.wd),mTot=sumAmt(me),mW=sumAmt(mAll.filter(e=>e.wd)),mRows=sums(me);
  const endT=new Date(sy,sm+1,1).getTime(),bal=balBefore(endT),owedS=debtAt(endT);
  const tot=smode==='d'?dTot:mTot,rows=smode==='d'?sums(dl):mRows;
  if(ssel&&!rows.find(r=>r.id===ssel))ssel=null;

  /* pie */
  const C=2*Math.PI*80;let acc=0,seg='';
  rows.forEach(r=>{
    const f=r.v/tot,gap=rows.length>1?3:0,len=Math.max(0,f*C-gap);
    seg+=`<circle class="seg" cx="100" cy="100" r="80" fill="none" stroke="${gl(r.id).color}" stroke-width="${ssel===r.id?34:26}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)" opacity="${ssel&&ssel!==r.id?.3:1}" onclick="pickS('${r.id}')"/>`;
    acc+=f*C;
  });
  $('chartS').innerHTML=`<svg viewBox="0 0 200 200" role="img" aria-label="Savings by goal"><circle cx="100" cy="100" r="80" fill="none" stroke-width="26" style="stroke:var(--soft)"/>${seg}<text x="100" y="107" text-anchor="middle" font-size="19" font-weight="800" style="fill:var(--k)">${fmt(Math.round(tot))}</text></svg>`;

  /* day pill */
  let mid;
  if(ssel){
    const r=rows.find(x=>x.id===ssel);
    mid=`<i style="background:${gl(ssel).color}"></i>${esc(gl(ssel).name)} <b>${fmt(r.v)}</b> ${Math.round(r.v/tot*100)}%`+(smode==='d'?`<small>${dayLabel(sOff)}</small>`:'');
  }else mid=`${dayLabel(sOff)} <b>${fmt(dTot)}</b>`+(dW>0?`<small class="wdc">−${fmt(dW)} withdrawn</small>`:'');
  $('pillS').innerHTML=pnb('dayS(1)',sOff>=mx,'Previous day','‹')+`<div class="mid">${mid}</div>`+pnb('dayS(-1)',sOff<=0,'Next day','›');

  /* month card */
  const atNow=sy===new Date().getFullYear()&&sm===new Date().getMonth();
  $('monthS').innerHTML=`<div class="nav"><button onclick="stepS(-1)" aria-label="Previous month">‹</button><span>${monthName(sy,sm)}</span><button onclick="stepS(1)" aria-label="Next month" ${atNow?'disabled':''}>›</button></div>
    <div class="tot">${fmt(mTot)}</div><div class="cap">Saved</div>
    <div class="bal">${mW>0?`<span>Withdrew <b class="wdr">−${fmt(mW)}</b></span>`:''}<span>Total savings <b ${bal<0?'style="color:var(--red)"':''}>${fmt(bal)}</b></span>${owedS>0?`<span>Net of debt <b ${bal-owedS<0?'style="color:var(--red)"':''}>${fmt(r2(bal-owedS))}</b></span>`:''}</div>`
    +(S.sv.length?'':'<div class="st" style="padding:4px 0 2px">Tap + to add savings</div>')
    +mRows.map(r=>`<button class="row" onclick="pickRowS('${r.id}')"><i class="dot" style="background:${gl(r.id).color}"></i><span>${esc(gl(r.id).name)}</span><b>${fmt(r.v)}</b></button>`).join('');

  /* growth graph: total savings at the end of each of the last 6 months up to the month being viewed */
  const g=$('growS');g.style.display=S.sv.length?'':'none';
  if(S.sv.length){
    const pts=[];
    for(let i=5;i>=0;i--){const d=new Date(sy,sm-i,1);pts.push({l:d.toLocaleDateString('en-US',{month:'short'}),v:balBefore(new Date(d.getFullYear(),d.getMonth()+1,1).getTime())})}
    const W=300,H=140,L=16,R=16,TP=24,BT=26;
    const lo=Math.min(0,...pts.map(p=>p.v)),hi=Math.max(1,...pts.map(p=>p.v)),rg=hi-lo;
    const X=i=>L+i*(W-L-R)/(pts.length-1),Y=v=>TP+(1-(v-lo)/rg)*(H-TP-BT);
    const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join('');
    const area=line+`L${X(pts.length-1).toFixed(1)} ${Y(0).toFixed(1)}L${X(0).toFixed(1)} ${Y(0).toFixed(1)}Z`;
    const last=pts.length-1;
    g.innerHTML=`<div class="ct"><span>Savings growth</span></div>
      <svg class="gsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Total savings over the last 6 months">
        <path d="${area}" style="fill:var(--soft)"/>
        <line x1="${L}" x2="${W-R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" style="stroke:var(--mut)" stroke-width=".6" stroke-dasharray="2 3"/>
        <path d="${line}" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--k)"/>
        ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===last?4.5:3.5}" stroke-width="2.2" style="stroke:var(--k);fill:${i===last?'var(--k)':'var(--w)'}"/>
          <text x="${X(i).toFixed(1)}" y="${(Y(p.v)-9).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="${i===last?800:600}" style="fill:${i===last?'var(--k)':'var(--mut)'}">${short(p.v)}</text>
          <text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:var(--mut)">${p.l}</text>`).join('')}
      </svg>
      <div class="cap" style="margin:6px 0 0">Total savings at month end</div>`;
  }

  /* balance by goal, as of the end of the month being viewed; goals with a target always show, with progress */
  const gr=S.sg.map(c=>({c:gl(c.id),t:c.target||0,v:balBefore(endT,c.id)})).filter(r=>r.v!==0||r.t).sort((a,b)=>(b.t>0)-(a.t>0)||b.v-a.v);
  const gc=$('goalS');gc.style.display=gr.length?'':'none';
  if(gr.length){
    const gm=Math.max(1,...gr.filter(r=>!r.t).map(r=>r.v));
    gc.innerHTML=`<div class="ct"><span>By goal</span><span>${fmt(bal)}</span></div>`
      +gr.map(r=>{
        const pct=r.t?Math.max(0,Math.min(100,r.v/r.t*100)):Math.max(2,Math.max(0,r.v)/gm*100),done=r.t&&r.v>=r.t;
        const sub=r.t?`<small>${done?'Goal reached ✓':`${fmt(Math.max(0,r.t-r.v))} to go · ${Math.floor(Math.max(0,r.v)/r.t*100)}%`}</small>`:'';
        return `<div class="it mo"><i class="dot" style="background:${r.c.color}"></i><span class="m">${esc(r.c.name)}${sub}</span><span class="neg${r.v<0?' wdr':''}">${fmt(r.v)}${r.t?` <span class="gtg">/ ${fmt(r.t)}</span>`:''}</span><span class="tr"><i style="width:${r.t?Math.max(pct,r.v>0?2:0):pct}%;background:${r.c.color}"></i></span></div>`;
      }).join('');
  }
}
function pickS(id){ssel=ssel===id?null:id;renderS()}

function dayS(d){sOff=Math.max(0,Math.min(sMaxBack(),sOff+d));smode='d';ssel=null;const D=dayStart(sOff);sy=D.getFullYear();sm=D.getMonth();renderS()}
function toMonthS(){if(smode!=='m'||sOff){smode='m';sOff=0;ssel=null;renderS()}}

/* add savings / withdraw sheet */
const avail=id=>svNet(S.sv.filter(e=>e.cat===id&&e.id!==editSv)); /* what can be withdrawn from a goal (ignores the entry being edited) */

  let b=null,bv=0;S.sg.forEach(c=>{const v=gBal(c.id);if(v>bv){bv=v;b=c.id}});
  if(b)pickedGoal=b;

function openSv(wd){

    <button class="go ${addWd?'wdb':''}" onclick="addSv()">${editSv?'Save':addWd?'Withdraw':'Add savings'}</button>${editSv?'<button class="go ghost" onclick="closeSheet()">Cancel</button>':''}`);
  $('ov').classList.toggle('top',!!editSv); /* editing starts from History, which sits above the normal sheet layer */

}
function reopenSv(fn){const a=$('a').value,n=$('n').value,d=$('d').value;fn();openSv();$('a').value=a;$('n').value=n;$('d').value=d}
function pickGoal(id){reopenSv(()=>{pickedGoal=id})}

function editSaving(id){
  const e=S.sv.find(x=>x.id===id);if(!e)return;

function addSv(){
  const amt=parseFloat($('a').value);
  if(!(amt>0)){$('a').focus();return}
  const D=parseIso($('d').value),now=new Date();
  if(!D||D>dayStart(0)){$('d').focus();return}
  const goal=S.sg.find(c=>c.id===pickedGoal);if(!goal)return;
  const ed=editSv&&S.sv.find(x=>x.id===editSv),t0=ed?new Date(ed.ts):now; /* editing keeps the entry's original time of day */
  const rec={cat:pickedGoal,amt:Math.round(amt*100)/100,note:$('n').value.trim(),
    ts:new Date(D.getFullYear(),D.getMonth(),D.getDate(),t0.getHours(),t0.getMinutes(),t0.getSeconds(),t0.getMilliseconds()).getTime()};
  const wd=addWd,edId=ed?ed.id:null;

    }
    /* confirm every new withdrawal (cancel keeps the sheet open, nothing is taken out) */
    if(!(ed&&ed.wd)){
      ask(`Are you sure you want to withdraw ${fmt(rec.amt)} from ${goal.name}?`,()=>finishSv(rec,wd,edId),'Withdraw');
      return;
    }

function finishSv(rec,wd,edId){

  if(ed){Object.assign(ed,rec);if(wd)ed.wd=true;else delete ed.wd}

  if($('hist').classList.contains('show'))hist();
  /* jump the pie to the day that was just added to */
  const D=new Date(rec.ts),D0=new Date(D.getFullYear(),D.getMonth(),D.getDate());
  sy=D.getFullYear();sm=D.getMonth();smode='d';sOff=Math.max(0,Math.round((dayStart(0)-D0)/864e5));ssel=null;renderS();
}
function delSv(id){
  const e=S.sv.find(x=>x.id===id);if(!e)return;
  const g=gl(e.cat),low=!e.wd&&gBal(e.cat)-e.amt<0;
  ask(`Delete this ${fmt(e.amt)} ${e.wd?'withdrawal':'saving'}?`+(low?` ${g.name} will go below zero.`:''),()=>{S.sv=S.sv.filter(x=>x.id!==id);save();render();hist()});
}

/* savings history */
function histS(){
  let h=`<div class="hh"><span>Savings history</span><button class="x" onclick="closeHist()" aria-label="Close">×</button></div>
  <div class="tabs"><button class="${hTab==='d'?'on':''}" onclick="hTab='d';hist()">Days</button><button class="${hTab==='m'?'on':''}" onclick="hTab='m';hist()">Months</button></div><div class="hl">`;
  const list=[...S.sv].sort((a,b)=>b.ts-a.ts);
  if(!list.length)h+='<div class="st" style="padding:36px 0">Nothing saved yet</div>';
  else if(hTab==='d'){
    const days=[];
    list.forEach(e=>{
      const k=iso(new Date(e.ts));let d=days[days.length-1];
      if(!d||d.k!==k){d={k,ts:e.ts,dep:0,wd:0,rows:[]};days.push(d)}
      if(e.wd)d.wd+=e.amt;else d.dep+=e.amt;
      d.rows.push(e);
    });
    days.forEach(d=>{
      h+=`<div class="dh"><span>${new Date(d.ts).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</span><span>${d.dep>0?`<span class="pos">+${fmt(d.dep)}</span>`:''}${d.dep>0&&d.wd>0?' · ':''}${d.wd>0?`<span class="wdr">−${fmt(d.wd)}</span>`:''}</span></div>`;
      d.rows.forEach(e=>{
        const c=gl(e.cat);
        h+=`<div class="it"><i class="dot" style="background:${c.color}"></i><div class="m"><div>${esc(e.note||(e.wd?'Withdrawal':c.name))}</div><small>${esc(e.note?c.name+' · ':(e.wd?c.name+' · ':''))}${hTime(e.ts)}</small></div><span class="neg ${e.wd?'wdr':'pos'}">${e.wd?'−':'+'}${fmt(e.amt)}</span><button class="x ed" onclick="editSaving('${e.id}')" aria-label="Edit">${PEN}</button><button class="x" onclick="delSv('${e.id}')" aria-label="Delete">×</button></div>`;
      });
    });
  }else{
    const dep={},wdr={},n={};
    list.forEach(e=>{const d=new Date(e.ts),k=d.getFullYear()*12+d.getMonth();dep[k]=dep[k]||0;wdr[k]=wdr[k]||0;n[k]=(n[k]||0)+1;if(e.wd)wdr[k]+=e.amt;else dep[k]+=e.amt});
    const keys=Object.keys(dep).sort((a,b)=>b-a),mx=Math.max(1,...keys.map(k=>dep[k]));
    keys.forEach(k=>{
      const y=Math.floor(k/12),mo=k%12;
      h+=`<button class="it mo" onclick="sy=${y};sm=${mo};smode='m';sOff=0;ssel=null;closeHist();render()"><span class="m"><b>${monthName(y,mo)}</b><small>${n[k]} entr${n[k]===1?'y':'ies'}${wdr[k]>0?` · <span class="wdr">−${fmt(wdr[k])} withdrawn</span>`:''}</small></span><span class="neg">${fmt(dep[k])}</span><span class="tr"><i style="width:${Math.max(2,dep[k]/mx*100)}%"></i></span></button>`;
    });
  }
  $('hist').innerHTML=h+'</div>';
}

/* follow device theme live; the Settings toggle still works until the device theme changes */
function syncSys(){
  const s=sysTheme();
  if(s===lastSys)return;
  lastSys=s;
  document.documentElement.dataset.theme=s;
  saveTheme(s);
  render();
  if($('hist').classList.contains('show'))hist();
  if($('ov').classList.contains('show')&&$('imp'))openSettings();
}
if(window.matchMedia){
  const mq=matchMedia('(prefers-color-scheme:dark)');
  mq.addEventListener?mq.addEventListener('change',syncSys):mq.addListener&&mq.addListener(syncSys);
}
/* fallback for browsers/PWAs that don't fire the change event while in the background */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSys()});
window.addEventListener('pageshow',syncSys);
window.addEventListener('focus',syncSys);

try{if(localStorage.getItem('expense-tracker-view')==='s')V='s'}catch(e){}
setView(V);
render();
</script>
</body>
</html>
