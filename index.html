<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expense Tracker</title>
<script>(function(){
var d=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light',t=null,s=null;
try{t=localStorage.getItem('expense-tracker-theme');s=localStorage.getItem('expense-tracker-theme-sys')}catch(e){}
/* use the saved manual choice only if the device theme hasn't changed since it was made */
if((t!=='dark'&&t!=='light')||s!==d)t=d;
document.documentElement.dataset.theme=t})()</script>
<style>
:root{--k:#000;--w:#fff;--mut:#6b6b6b;--soft:#efefef;--red:#e03131;--blue:#1c7ed6;--green:#2f9e44}
[data-theme=dark]{--k:#fff;--w:#000;--mut:#9a9a9a;--soft:#242424;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--w);color:var(--k);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{position:relative;max-width:440px;height:100%;margin:auto;display:flex;flex-direction:column;border-inline:2px solid var(--k);overflow:hidden}
@media(max-width:440px){.app{border-inline:0}}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px 20px;border-bottom:2px solid var(--k)}
.logo{height:28px;width:auto;max-width:calc(100% - 56px);display:block}
.logo.d,[data-theme=dark] .logo.l{display:none}
[data-theme=dark] .logo.d{display:block}
.gear{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.gear svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid var(--k);border-radius:99px;padding:9px;font-weight:700}
.seg button.on{background:var(--k);color:var(--w)}
.st{color:var(--mut);text-align:center;min-height:1.4em}
main{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.chart{width:min(250px,68vw);aspect-ratio:1;flex:none}
.chart svg{width:100%;height:100%;display:block}
.seg{cursor:pointer}
.pill{min-width:min(260px,100%);max-width:100%;padding:6px 8px;border:2px solid var(--k);border-radius:16px;display:flex;align-items:center;gap:4px}
.pill .mid{flex:1;min-width:0;display:flex;gap:2px 8px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.mid small{width:100%;color:var(--mut);line-height:1.1}
.pn{width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;flex:none}
.pn:disabled{opacity:.2;cursor:default}
.pill i,.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.card{width:100%;border:2px solid var(--k);border-radius:24px;padding:14px 18px;cursor:pointer}
.nav{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.nav button{width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1}
.nav button:disabled{opacity:.2;cursor:default}
.tot{text-align:center;font-size:28px;font-weight:800;margin:2px 0 8px}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--soft);width:100%;text-align:left}
.row span:nth-child(2){flex:1}
.bar{display:flex;align-items:center;justify-content:space-evenly;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--k)}
.rb{width:46px;height:46px;border:2px solid var(--k);border-radius:50%;display:grid;place-items:center}
.rb.big{width:64px;height:64px;background:var(--k);color:var(--w)}
.rb svg{width:55%;height:55%;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.rb:active{transform:scale(.94)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
.ov.show{display:flex}
.sh{width:100%;max-height:85%;overflow:auto;background:var(--w);border-top:2px solid var(--k);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.in{width:100%;border:2px solid var(--k);border-radius:14px;padding:12px 14px;background:var(--w);outline:0}
.in[type=date]{min-height:50px}
.in:focus{border-color:var(--blue)}
.amt{font-size:30px;font-weight:800}
.lb{color:var(--mut);font-size:14px;font-weight:700;margin-bottom:-8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--k);border-radius:99px;padding:6px 14px;display:flex;align-items:center;gap:8px}
.chip.on{background:var(--k);color:var(--w)}
.sw{display:flex;flex-wrap:wrap;gap:12px}
.cc{position:relative;width:34px;height:34px;border-radius:50%;border:2px dashed var(--k);display:grid;place-items:center;cursor:pointer;overflow:hidden}
.cc svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.cc input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--w);box-shadow:0 0 0 2px transparent}
.sw button.on{box-shadow:0 0 0 2px var(--k)}
.sw button.cc{border:2px dashed var(--k);box-shadow:none}
.sw button.cc.act{background:var(--k);color:var(--w);border-style:solid}
.sw.rmm button:not(.cc){position:relative}
.sw.rmm button:not(.cc)::after{content:'×';position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;font-weight:700;line-height:17px;text-align:center}
#cf{z-index:9;align-items:center;padding:24px}
.dlg{width:100%;background:var(--w);border:2px solid var(--k);border-radius:24px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:18px;text-align:center}
.dlg p{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.seg button.dan{background:var(--red);border-color:var(--red);color:#fff}
.go{background:var(--k);color:var(--w);border-radius:14px;padding:13px;font-weight:700;width:100%}
.go:disabled{opacity:.35;cursor:default}
.go.ghost{background:none;color:var(--k);border:2px solid var(--k)}
.x{width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1;color:var(--red);flex:none}
#hist,#rep{position:absolute;inset:0;background:var(--w);display:none;flex-direction:column}
#hist{z-index:6}
#rep{z-index:7}
#hist.show,#rep.show{display:flex}
.hh{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;border-bottom:2px solid var(--k);font-size:22px;font-weight:800}
.hh .x{color:var(--k);font-size:28px}
.tabs{display:flex;gap:8px;padding:12px 20px 4px}
.tabs button{flex:1;border:2px solid var(--k);border-radius:99px;padding:6px;font-weight:700}
.tabs button.on{background:var(--k);color:var(--w)}
.hl{flex:1;overflow:auto;padding:8px 20px 20px}
.hl img{width:100%;display:block;border:2px solid var(--k);border-radius:14px;margin:8px 0 14px;background:#fff}
.rf{display:flex;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--k)}
.rf:empty{display:none}
.rf .go{flex:1;width:auto}
.dh{display:flex;justify-content:space-between;font-weight:800;padding:14px 0 4px}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--soft)}
.it .m{flex:1;min-width:0}
.it small{color:var(--mut);display:block}
.neg{font-weight:700}
</style>
</head>

    <button class="rb" title="Add category" onclick="openCat()"><svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1" fill="currentColor"/></svg></button>

<script>
const K='expense-tracker-v1';
const COLORS=['#e03131','#1c7ed6','#2f9e44','#f08c00','#000000','#868e96'];
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.cats)||!Array.isArray(S.exp))S={cats:[
  {id:'c1',name:'Food',color:COLORS[0]},{id:'c2',name:'Travel',color:COLORS[1]},
  {id:'c3',name:'Bills',color:COLORS[2]},{id:'c4',name:'Other',color:COLORS[5]}],exp:[]};
if(!Array.isArray(S.colors))S.colors=[];
if(!Array.isArray(S.hidden))S.hidden=[];
let rmMode=false;
const palette=()=>COLORS.filter(c=>!S.hidden.includes(c)).concat(S.colors);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>'₹'+n.toLocaleString('en-IN',{maximumFractionDigits:2});
const lum=c=>{const n=parseInt(c.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255};
const col=c=>{const d=document.documentElement.dataset.theme==='dark',l=lum(c);return d&&l<.18?'#ffffff':!d&&l>.88?'#000000':c};
const cat=id=>{const c=S.cats.find(c=>c.id===id)||{name:'Deleted',color:'#868e96'};return{...c,color:col(c.color)}};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const monthName=(y,m)=>new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
const T=new Date();let vy=T.getFullYear(),vm=T.getMonth(),sel=null,hTab='d',pc=COLORS[0],pickedCat=null;
let mode='m',dOff=0; /* mode: 'm' = pie shows the month, 'd' = pie shows one day; dOff = days back from today */
const dayStart=o=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()-o)};
const sameDay=(ts,d)=>{const x=new Date(ts);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()&&x.getDate()===d.getDate()};
const maxBack=()=>{if(!S.exp.length)return 0;const m=S.exp.reduce((a,e)=>Math.min(a,e.ts),Infinity),f=new Date(m);return Math.max(0,Math.round((dayStart(0)-new Date(f.getFullYear(),f.getMonth(),f.getDate()))/864e5))};
const dayLabel=o=>{if(o===0)return'Today';if(o===1)return'Yesterday';const d=dayStart(o),o2={weekday:'short',day:'numeric',month:'short'};if(d.getFullYear()!==new Date().getFullYear())o2.year='numeric';return d.toLocaleDateString('en-US',o2)};

function sums(list){const m={};list.forEach(e=>m[e.cat]=(m[e.cat]||0)+e.amt);
  return Object.entries(m).map(([id,v])=>({id,v})).sort((a,b)=>b.v-a.v)}
const inMonth=e=>{const d=new Date(e.ts);return d.getFullYear()===vy&&d.getMonth()===vm};

function render(){
  const mx=maxBack();if(dOff>mx)dOff=mx;
  const D=dayStart(dOff),dl=S.exp.filter(e=>sameDay(e.ts,D)),dTot=dl.reduce((a,e)=>a+e.amt,0);
  const me=S.exp.filter(inMonth),mTot=me.reduce((a,e)=>a+e.amt,0),mRows=sums(me);
  const tot=mode==='d'?dTot:mTot,rows=mode==='d'?sums(dl):mRows;
  if(sel&&!rows.find(r=>r.id===sel))sel=null;
  const C=2*Math.PI*80;let acc=0,seg='';
  rows.forEach(r=>{
    const f=r.v/tot,gap=rows.length>1?3:0,len=Math.max(0,f*C-gap);
    seg+=`<circle class="seg" cx="100" cy="100" r="80" fill="none" stroke="${cat(r.id).color}" stroke-width="${sel===r.id?34:26}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)" opacity="${sel&&sel!==r.id?.3:1}" onclick="pick('${r.id}')"/>`;
    acc+=f*C;
  });
  $('chart').innerHTML=`<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="80" fill="none" stroke-width="26" style="stroke:var(--soft)"/>${seg}<text x="100" y="107" text-anchor="middle" font-size="19" font-weight="800" style="fill:var(--k)">${fmt(Math.round(tot))}</text></svg>`;

  const pn=(fn,dis,lab,ch)=>`<button class="pn" onclick="${fn}" aria-label="${lab}" ${dis?'disabled':''}>${ch}</button>`;
  let mid;
  if(sel){
    const r=rows.find(x=>x.id===sel);
    mid=`<i style="background:${cat(sel).color}"></i>${esc(cat(sel).name)} <b>${fmt(r.v)}</b> ${Math.round(r.v/tot*100)}%`+(mode==='d'?`<small>${dayLabel(dOff)}</small>`:'');
  }else mid=`${dayLabel(dOff)} <b>${fmt(dTot)}</b>`;
  $('pill').innerHTML=pn('day(1)',dOff>=mx,'Previous day','‹')+`<div class="mid">${mid}</div>`+pn('day(-1)',dOff<=0,'Next day','›');

  const atNow=vy===new Date().getFullYear()&&vm===new Date().getMonth();
  $('month').innerHTML=`<div class="nav"><button onclick="step(-1)" aria-label="Previous month">‹</button><span>${monthName(vy,vm)}</span><button onclick="step(1)" aria-label="Next month" ${atNow?'disabled':''}>›</button></div>
    <div class="tot">${fmt(mTot)}</div>`+mRows.map(r=>`<button class="row" onclick="pickRow('${r.id}')"><i class="dot" style="background:${cat(r.id).color}"></i><span>${esc(cat(r.id).name)}</span><b>${fmt(r.v)}</b></button>`).join('');
}
function pick(id){sel=sel===id?null:id;render()}
function step(d){vm+=d;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}mode='m';dOff=0;sel=null;render()}
function day(d){dOff=Math.max(0,Math.min(maxBack(),dOff+d));mode='d';sel=null;const D=dayStart(dOff);vy=D.getFullYear();vm=D.getMonth();render()}
function toMonth(){if(mode!=='m'||dOff){mode='m';dOff=0;sel=null;render()}}
function pickRow(id){const was=mode==='m';mode='m';dOff=0;sel=was&&sel===id?null:id;render()}

/* sheets */
function showSheet(h){$('sh').innerHTML=h;$('ov').classList.add('show')}
function closeSheet(){rmMode=false;$('ov').classList.remove('show')}

/* confirm before anything is removed */
let cfFn=null;
function ask(msg,fn,label){
  cfFn=fn;
  $('cf').innerHTML=`<div class="dlg" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><div class="seg"><button id="cfn" onclick="cfNo()">Cancel</button><button class="dan" onclick="cfYes()">${esc(label||'Delete')}</button></div></div>`;
  $('cf').classList.add('show');setTimeout(()=>$('cfn')&&$('cfn').focus(),30);
}
function cfNo(){cfFn=null;$('cf').classList.remove('show')}
function cfYes(){const f=cfFn;cfNo();if(f)f()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('cf').classList.contains('show'))cfNo()});

function openExp(){
  if(!S.cats.length){openCat();return}
  if(!S.cats.find(c=>c.id===pickedCat))pickedCat=S.cats[0].id;
  showSheet(`<input class="in amt" id="a" type="number" inputmode="decimal" step="any" min="0" placeholder="₹0" onkeydown="if(event.key==='Enter')addExp()">
    <div class="chips">${S.cats.map(c=>`<button class="chip ${c.id===pickedCat?'on':''}" onclick="pickCat('${c.id}')"><i class="dot" style="background:${col(c.color)}"></i>${esc(c.name)}</button>`).join('')}</div>
    <input class="in" id="n" placeholder="Note" maxlength="60" onkeydown="if(event.key==='Enter')addExp()">
    <button class="go" onclick="addExp()">Add</button>`);
  setTimeout(()=>$('a').focus(),50);
}
function pickCat(id){
  const a=$('a').value,n=$('n').value;pickedCat=id;openExp();$('a').value=a;$('n').value=n;
}
function addExp(){
  const amt=parseFloat($('a').value);
  if(!(amt>0)){$('a').focus();return}
  S.exp.push({id:uid('e'),cat:pickedCat,amt:Math.round(amt*100)/100,note:$('n').value.trim(),ts:Date.now()});
  save();closeSheet();
  const d=new Date();vy=d.getFullYear();vm=d.getMonth();mode='m';dOff=0;sel=null;render();
}

function openCat(){
  const pal=palette();if(!pal.length)S.hidden=[];if(!palette().includes(pc))pc=palette()[0];
  const rm=rmMode&&palette().length>1;
  showSheet(`<input class="in" id="cn" placeholder="Category name" maxlength="20" onkeydown="if(event.key==='Enter')addCat()">
    <div class="sw ${rm?'rmm':''}">${palette().map(c=>`<button class="${c===pc&&!rm?'on':''}" style="background:${col(c)}" onclick="${rm?`rmColor('${c}')`:`pc='${c}';swap()`}" aria-label="${rm?'Remove colour':'Colour'}"></button>`).join('')}<label class="cc" title="More colours"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><input type="color" value="${pc}" onchange="newColor(this.value)"></label><button class="cc ${rmMode?'act':''}" title="Remove colours" aria-label="Remove colours" onclick="togRm()"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button></div>
    <button class="go" onclick="addCat()">Add</button>
    ${S.cats.map(c=>`<div class="it"><i class="dot" style="background:${col(c.color)}"></i><span class="m">${esc(c.name)}</span><button class="x" onclick="delCat('${c.id}')" aria-label="Delete">×</button></div>`).join('')}`);
}
function swap(){const v=$('cn').value;openCat();$('cn').value=v}
function togRm(){rmMode=!rmMode;swap()}
function rmColor(c){
  if(palette().length<=1)return;
  ask('Remove this colour?',()=>{
    if(COLORS.includes(c))S.hidden.push(c);else S.colors=S.colors.filter(x=>x!==c);
    if(pc===c)pc=palette()[0];
    save();swap();
  },'Remove');
}
function newColor(v){
  v=v.toLowerCase();
  if(COLORS.includes(v)){if(S.hidden.includes(v)){S.hidden=S.hidden.filter(x=>x!==v);save()}}
  else if(!S.colors.includes(v)){S.colors.push(v);save()}
  rmMode=false;
  pc=v;swap();
}
function addCat(){
  const n=$('cn').value.trim();if(!n){$('cn').focus();return}
  S.cats.push({id:uid('c'),name:n,color:pc});save();render();openCat();
}
function delCat(id){
  const c=S.cats.find(x=>x.id===id),n=S.exp.filter(e=>e.cat===id).length;
  ask(n?`Delete "${c?c.name:'this category'}" and its ${n} expense${n>1?'s':''}?`:`Delete "${c?c.name:'this category'}"?`,()=>{
    S.cats=S.cats.filter(c=>c.id!==id);S.exp=S.exp.filter(e=>e.cat!==id);
    save();render();openCat();
  });
}

/* settings / theme */
const sysTheme=()=>window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
let lastSys=sysTheme();
function saveTheme(t){try{localStorage.setItem('expense-tracker-theme',t);localStorage.setItem('expense-tracker-theme-sys',sysTheme())}catch(e){}}
function setTheme(t){
  document.documentElement.dataset.theme=t;
  saveTheme(t);
  render();openSettings();
}
function openSettings(msg){
  const t=document.documentElement.dataset.theme==='dark'?'dark':'light';
  showSheet(`<div class="seg"><button class="${t==='light'?'on':''}" onclick="setTheme('light')">Light</button><button class="${t==='dark'?'on':''}" onclick="setTheme('dark')">Dark</button></div>
    <div class="seg"><button onclick="startExtract()">Extract report</button></div>
    <div class="seg"><button onclick="exportData()">Export</button><button onclick="$('imp').click()">Import</button></div>
    <div class="st">${msg||''}</div>
    <input type="file" id="imp" accept=".json,application/json" hidden onchange="importData(this.files[0])">`);
}
function exportData(){
  const blob=new Blob([JSON.stringify({app:'expense-tracker',version:1,exported:new Date().toISOString(),cats:S.cats,exp:S.exp},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='expense-tracker-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  openSettings('Exported');
}
function importData(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.cats)||!Array.isArray(d.exp))throw 0;
      const cids=new Set(S.cats.map(c=>c.id)),eids=new Set(S.exp.map(e=>e.id));
      let nc=0,ne=0;
      d.cats.forEach(c=>{
        if(c&&typeof c.id==='string'&&typeof c.name==='string'&&/^#[0-9a-f]{6}$/i.test(c.color)&&!cids.has(c.id)){
          S.cats.push({id:c.id,name:c.name.slice(0,20),color:c.color.toLowerCase()});cids.add(c.id);nc++;
        }
      });
      d.exp.forEach(e=>{
        if(e&&typeof e.id==='string'&&typeof e.cat==='string'&&Number.isFinite(e.amt)&&e.amt>0&&Number.isFinite(e.ts)&&!eids.has(e.id)){
          S.exp.push({id:e.id,cat:e.cat,amt:e.amt,note:typeof e.note==='string'?e.note.slice(0,60):'',ts:e.ts});eids.add(e.id);ne++;
        }
      });
      save();render();
      openSettings(`Imported ${ne} expenses, ${nc} categories`);
    }catch(x){openSettings('Invalid file')}
  };
  r.readAsText(f);
}

/* extract report: pick a month / day / period, get a PNG report */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseIso=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const dfmt=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
let X={t:'m',y:vy,m:vm,d:'',from:'',to:''};
let repUrls=[],repFiles=[];

function startExtract(){
  const n=new Date();
  X.y=vy;X.m=vm;X.d=iso(dayStart(dOff));
  X.from=iso(new Date(n.getFullYear(),n.getMonth(),1));X.to=iso(n);
  openExtract();
}
function xStep(d){X.m+=d;if(X.m<0){X.m=11;X.y--}if(X.m>11){X.m=0;X.y++}openExtract()}
function preset(k){
  const n=new Date();
  if(k==='7')X.from=iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()-6));
  else if(k==='30')X.from=iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()-29));
  else X.from=iso(new Date(n.getFullYear(),0,1));
  X.to=iso(n);openExtract();
}
function xRange(){
  let a,b,label,file;
  if(X.t==='m'){
    a=new Date(X.y,X.m,1);b=new Date(X.y,X.m+1,1);label=monthName(X.y,X.m);file=X.y+'-'+pad(X.m+1);
  }else if(X.t==='d'){
    const d=parseIso(X.d);if(!d)return null;
    a=d;b=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    label=d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short',year:'numeric'});file=X.d;
  }else{
    let f=parseIso(X.from),t=parseIso(X.to);if(!f||!t)return null;
    if(f>t){const s=f;f=t;t=s}
    a=f;b=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1);
    label=dfmt(f)+' – '+dfmt(t);file=iso(f)+'_to_'+iso(t);
  }
  const list=S.exp.filter(e=>e.ts>=a.getTime()&&e.ts<b.getTime()).sort((p,q)=>p.ts-q.ts);
  return{a,b,label,file,list,total:list.reduce((s,e)=>s+e.amt,0)};
}
function openExtract(){
  const r=xRange(),n=r?r.list.length:0,today=iso(new Date());
  const tabs=[['m','Month'],['d','Day'],['p','Period']].map(([k,l])=>`<button class="${X.t===k?'on':''}" onclick="X.t='${k}';openExtract()">${l}</button>`).join('');
  let body;
  if(X.t==='m'){
    const now=new Date(),atNow=X.y===now.getFullYear()&&X.m===now.getMonth();
    body=`<div class="nav"><button onclick="xStep(-1)" aria-label="Previous month">‹</button><span>${monthName(X.y,X.m)}</span><button onclick="xStep(1)" aria-label="Next month" ${atNow?'disabled':''}>›</button></div>`;
  }else if(X.t==='d'){
    body=`<input class="in" type="date" value="${X.d}" max="${today}" onchange="X.d=this.value;openExtract()">`;
  }else{
    body=`<div class="chips"><button class="chip" onclick="preset('7')">Last 7 days</button><button class="chip" onclick="preset('30')">Last 30 days</button><button class="chip" onclick="preset('y')">This year</button></div>
    <div class="lb">From</div><input class="in" type="date" value="${X.from}" max="${today}" onchange="X.from=this.value;openExtract()">
    <div class="lb">To</div><input class="in" type="date" value="${X.to}" max="${today}" onchange="X.to=this.value;openExtract()">`;
  }
  const info=!r?'Pick a valid date':n?`${n} expense${n===1?'':'s'} · ${fmt(r.total)}`:'No expenses in this range';
  showSheet(`<div class="seg">${tabs}</div>${body}<div class="st">${info}</div>
    <button class="go" onclick="makeReport()" ${n?'':'disabled'}>Create report</button>
    <div class="seg"><button onclick="openSettings()">Back</button></div>`);
}

function freeRep(){repUrls.forEach(u=>URL.revokeObjectURL(u));repUrls=[];repFiles=[]}
function closeRep(){$('rep').classList.remove('show');freeRep();$('repb').innerHTML='';$('repf').innerHTML=''}
function saveRep(){
  repFiles.forEach((f,i)=>setTimeout(()=>{
    const a=document.createElement('a');a.href=repUrls[i];a.download=f.name;
    document.body.appendChild(a);a.click();a.remove();
  },i*350));
}
async function shareRep(){try{await navigator.share({files:repFiles,title:'Expense report'})}catch(e){}}
async function makeReport(){
  const r=xRange();if(!r||!r.list.length)return;
  closeSheet();
  $('rep').classList.add('show');$('repf').innerHTML='';
  $('repb').innerHTML='<div class="st">Creating report…</div>';
  await new Promise(res=>setTimeout(res,30));
  try{
    const cvs=drawReport(r);
    const blobs=await Promise.all(cvs.map(c=>new Promise(res=>c.toBlob(res,'image/png'))));
    if(blobs.some(b=>!b))throw 0;
    freeRep();
    repFiles=blobs.map((b,i)=>new File([b],'expense-report-'+r.file+(blobs.length>1?'-p'+(i+1):'')+'.png',{type:'image/png'}));
    repUrls=blobs.map(b=>URL.createObjectURL(b));
    $('repb').innerHTML=repUrls.map((u,i)=>`<img src="${u}" alt="Report page ${i+1}">`).join('');
    let can=false;try{can=!!(navigator.share&&navigator.canShare&&navigator.canShare({files:repFiles}))}catch(e){}
    $('repf').innerHTML=`<button class="go" onclick="saveRep()">Save image${blobs.length>1?'s':''}</button>`+(can?`<button class="go ghost" onclick="shareRep()">Share</button>`:'');
  }catch(e){
    $('repb').innerHTML='<div class="st">Could not create the report</div>';
  }
}

function drawReport(r){
  const W=1080,P=64,CW=W-2*P,FF='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const INK='#111111',MUT='#6b6b6b',SOFT='#efefef',LINE='#e3e3e3';
  const f=(w,s)=>`${w} ${s}px ${FF}`;
  const cc=id=>{const c=S.cats.find(x=>x.id===id)||{name:'Deleted',color:'#868e96'};return{name:c.name,color:lum(c.color)>.88?'#000000':c.color}};
  const fit=(g,t,maxW)=>{if(g.measureText(t).width<=maxW)return t;while(t.length>1&&g.measureText(t+'…').width>maxW)t=t.slice(0,-1);return t+'…'};
  const shrink=(g,t,w,size,maxW)=>{while(size>18){g.font=f(w,size);if(g.measureText(t).width<=maxW)break;size-=2}g.font=f(w,size)};
  const rr=(g,x,y,w,h,rad)=>{g.beginPath();g.moveTo(x+rad,y);g.arcTo(x+w,y,x+w,y+h,rad);g.arcTo(x+w,y+h,x,y+h,rad);g.arcTo(x,y+h,x,y,rad);g.arcTo(x,y,x+w,y,rad);g.closePath()};

  /* numbers */
  const rows=sums(r.list).map(x=>({...x,...cc(x.id)}));
  const byDay={};
  r.list.forEach(e=>{const k=new Date(e.ts).toDateString();const o=byDay[k]||(byDay[k]={ts:e.ts,items:[],tot:0});o.items.push(e);o.tot+=e.amt});
  const days=Object.values(byDay);
  const hi=days.reduce((a,b)=>b.tot>a.tot?b:a);
  const end=Math.min(r.b.getTime(),dayStart(-1).getTime());
  const nd=Math.max(1,Math.round((end-r.a.getTime())/864e5));
  const tiles=[
    ['Total spent',fmt(r.total),''],
    ['Expenses',String(r.list.length),''],
    ['Daily average',fmt(r.total/nd),'over '+nd+' day'+(nd>1?'s':'')],
    ['Highest day',fmt(hi.tot),dfmt(new Date(hi.ts))]
  ];

  /* blocks (each knows its height and how to draw itself) */
  const items=[];
  const sec=(t,right)=>({h:96,head:true,draw:(g,y)=>{
    g.fillStyle=INK;g.font=f(800,38);g.fillText(t,P,y+60);
    if(right){g.fillStyle=MUT;g.font=f(600,26);g.textAlign='right';g.fillText(right,W-P,y+60)}
  }});
  const mini={h:110,draw:(g,y)=>{
    g.fillStyle=INK;g.font=f(800,30);
    g.fillText(fit(g,'Expense Report · '+r.label,CW),P,y+44);
    g.fillRect(P,y+66,CW,3);
  }};

  items.push({h:200,draw:(g,y)=>{
    g.fillStyle=INK;g.font=f(800,58);g.fillText('Expense Report',P,y+58);
    g.font=f(700,36);g.fillText(fit(g,r.label,CW),P,y+116);
    g.fillStyle=MUT;g.font=f(400,26);
    g.fillText('Generated '+new Date().toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),P,y+158);
    g.fillStyle=INK;g.fillRect(P,y+180,CW,4);
  }});

  items.push({h:370,draw:(g,y)=>{
    const tw=(CW-24)/2;
    tiles.forEach((t,i)=>{
      const x=P+(i%2)*(tw+24),ty=y+24+Math.floor(i/2)*174;
      g.lineWidth=3;g.strokeStyle=INK;rr(g,x+1.5,ty+1.5,tw-3,147,28);g.stroke();
      g.fillStyle=MUT;g.font=f(600,24);g.fillText(t[0],x+28,ty+44);
      g.fillStyle=INK;shrink(g,t[1],800,44,tw-56);g.fillText(t[1],x+28,ty+98);
      if(t[2]){g.fillStyle=MUT;g.font=f(400,22);g.fillText(fit(g,t[2],tw-56),x+28,ty+130)}
    });
  }});

  const legH=rows.length*60;
  items.push(sec('By category',rows.length+' categor'+(rows.length>1?'ies':'y')));
  items.push({h:Math.max(380,legH)+40,draw:(g,y)=>{
    const cx=P+190,cy=y+190,R=150;let a0=-Math.PI/2;
    g.lineWidth=64;g.lineCap='butt';
    g.strokeStyle=SOFT;g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.stroke();
    rows.forEach(x=>{
      const sw=x.v/r.total*Math.PI*2,gap=rows.length>1?0.03:0;
      g.strokeStyle=x.color;g.beginPath();
      g.arc(cx,cy,R,a0+gap/2,a0+gap/2+Math.max(sw-gap,0.002));g.stroke();
      a0+=sw;
    });
    g.textAlign='center';
    g.fillStyle=MUT;g.font=f(600,22);g.fillText('TOTAL',cx,cy-22);
    g.fillStyle=INK;shrink(g,fmt(r.total),800,38,200);g.fillText(fmt(r.total),cx,cy+26);
    const x0=P+420,xr=W-P,top=y+Math.max(0,(380-legH)/2);
    rows.forEach((x,i)=>{
      const ly=top+i*60,p=x.v/r.total*100,amt=fmt(x.v);
      g.fillStyle=x.color;g.beginPath();g.arc(x0+11,ly+24,11,0,Math.PI*2);g.fill();
      g.textAlign='right';g.fillStyle=MUT;g.font=f(600,26);g.fillText(p<1?'<1%':Math.round(p)+'%',xr,ly+32);
      g.fillStyle=INK;g.font=f(800,28);g.fillText(amt,xr-100,ly+32);
      const aw=g.measureText(amt).width;
      g.textAlign='left';g.font=f(600,28);
      g.fillText(fit(g,x.name,xr-100-aw-14-(x0+34)),x0+34,ly+32);
    });
  }});

  items.push(sec('All expenses',r.list.length+' total'));
  days.forEach(d=>{
    const dd=new Date(d.ts);
    items.push({h:76,head:true,draw:(g,y)=>{
      g.fillStyle=SOFT;rr(g,P,y+8,CW,60,16);g.fill();
      g.fillStyle=INK;g.font=f(800,28);
      g.fillText(dd.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}),P+22,y+47);
      g.textAlign='right';g.fillText(fmt(d.tot),W-P-22,y+47);
    }});
    d.items.forEach(e=>{
      const c=cc(e.cat),t=new Date(e.ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
      items.push({h:88,draw:(g,y)=>{
        g.fillStyle=c.color;g.beginPath();g.arc(P+22,y+44,11,0,Math.PI*2);g.fill();
        const amt=fmt(e.amt);
        g.fillStyle=INK;g.font=f(800,28);g.textAlign='right';g.fillText(amt,W-P-8,y+40);
        const aw=g.measureText(amt).width;
        g.textAlign='left';g.font=f(600,28);g.fillText(fit(g,e.note||c.name,CW-60-aw-24),P+52,y+40);
        g.fillStyle=MUT;g.font=f(400,23);g.fillText(fit(g,(e.note?c.name+' · ':'')+t,CW-60),P+52,y+72);
        g.fillStyle=LINE;g.fillRect(P,y+86,CW,2);
      }});
    });
  });
  items.push({h:150,draw:(g,y)=>{
    g.fillStyle=INK;g.fillRect(P,y+20,CW,4);
    g.font=f(800,40);g.fillText('Total',P,y+92);
    g.textAlign='right';shrink(g,fmt(r.total),800,44,CW-200);g.fillText(fmt(r.total),W-P,y+92);
  }});

  /* split into pages so tall reports never exceed canvas limits */
  const MAXH=3600,FOOT=80,pages=[];
  let cur=[],hh=0,cnt=0;
  items.forEach((it,i)=>{
    let need=it.h,j=i;
    while(items[j].head&&items[j+1]){j++;need+=items[j].h}
    if(cnt>0&&hh+need>MAXH){pages.push(cur);cur=[mini];hh=mini.h;cnt=0}
    cur.push(it);hh+=it.h;cnt++;
  });
  pages.push(cur);

  return pages.map((pg,pi)=>{
    const ch=P+pg.reduce((s,it)=>s+it.h,0)+FOOT;
    const c=document.createElement('canvas');c.width=W;c.height=ch;
    const g=c.getContext('2d');
    g.fillStyle='#ffffff';g.fillRect(0,0,W,ch);
    g.textBaseline='alphabetic';g.textAlign='left';
    let y=P;
    pg.forEach(it=>{g.save();it.draw(g,y);g.restore();y+=it.h});
    g.fillStyle=MUT;g.font=f(400,22);g.textAlign='left';g.fillText('Expense Tracker',P,ch-30);
    if(pages.length>1){g.textAlign='right';g.fillText('Page '+(pi+1)+' of '+pages.length,W-P,ch-30)}
    return c;
  });
}

/* history */
function openHist(){$('hist').classList.add('show');hist()}
function closeHist(){$('hist').classList.remove('show')}
function hist(){
  let h=`<div class="hh"><span>History</span><button class="x" onclick="closeHist()" aria-label="Close">×</button></div>
  <div class="tabs"><button class="${hTab==='d'?'on':''}" onclick="hTab='d';hist()">Days</button><button class="${hTab==='m'?'on':''}" onclick="hTab='m';hist()">Months</button></div><div class="hl">`;
  const list=[...S.exp].sort((a,b)=>b.ts-a.ts);
  if(hTab==='d'){
    const totals={};list.forEach(e=>{const k=new Date(e.ts).toDateString();totals[k]=(totals[k]||0)+e.amt});
    let last='';
    list.forEach(e=>{
      const d=new Date(e.ts),k=d.toDateString();
      if(k!==last){last=k;h+=`<div class="dh"><span>${d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span><span>${fmt(totals[k])}</span></div>`}
      const c=cat(e.cat);
      h+=`<div class="it"><i class="dot" style="background:${c.color}"></i><div class="m"><div>${esc(e.note||c.name)}</div><small>${esc(e.note?c.name+' · ':'')}${d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</small></div><span class="neg">${fmt(e.amt)}</span><button class="x" onclick="delExp('${e.id}')" aria-label="Delete">×</button></div>`;
    });
  }else{
    const m={};list.forEach(e=>{const d=new Date(e.ts),k=d.getFullYear()*12+d.getMonth();m[k]=(m[k]||0)+e.amt});
    Object.keys(m).sort((a,b)=>b-a).forEach(k=>{
      const y=Math.floor(k/12),mo=k%12;
      h+=`<button class="it" style="width:100%;text-align:left" onclick="vy=${y};vm=${mo};mode='m';dOff=0;sel=null;closeHist();render()"><span class="m"><b>${monthName(y,mo)}</b></span><span class="neg">${fmt(m[k])}</span></button>`;
    });
  }
  $('hist').innerHTML=h+'</div>';
}
function delExp(id){
  const e=S.exp.find(x=>x.id===id);
  ask(e?`Delete this ${fmt(e.amt)} expense?`:'Delete this expense?',()=>{S.exp=S.exp.filter(x=>x.id!==id);save();render();hist()});
}

/* follow device theme live; the Settings toggle still works until the device theme changes */
function syncSys(){
  const s=sysTheme();
  if(s===lastSys)return;
  lastSys=s;
  document.documentElement.dataset.theme=s;
  saveTheme(s);
  render();
  if($('hist').classList.contains('show'))hist();
  if($('ov').classList.contains('show')&&$('imp'))openSettings();
}
if(window.matchMedia){
  const mq=matchMedia('(prefers-color-scheme:dark)');
  mq.addEventListener?mq.addEventListener('change',syncSys):mq.addListener&&mq.addListener(syncSys);
}
/* fallback for browsers/PWAs that don't fire the change event while in the background */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSys()});
window.addEventListener('pageshow',syncSys);
window.addEventListener('focus',syncSys);

render();
</script>
</body>
